receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Defense in depth: drop attributes that commonly carry secrets.
  attributes/redact:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.x-api-key, action: delete}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  debug: {verbosity: basic}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/jaeger, debug]
