[project]
name = "agent-harness"
version = "0.1.0"
description = "Production-grade template for building reliable, safe, observable AI agents. Agent = Model + Harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "agent-harness contributors" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "anthropic>=0.40",
    "openai>=1.55",
    "redis>=5.2",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "numpy>=2.0",
    "docker>=7.1",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "prometheus-client>=0.21",
    "typer>=0.13",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml",
    "types-jsonschema",
    "types-docker",
    "fakeredis>=2.26",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "N", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sse_starlette.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: requires HARNESS_TEST_DATABASE_URL (Postgres with pgvector)",
    "docker: requires a running Docker daemon (auto-skipped when unavailable)",
    "integration: full-loop integration tests",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
