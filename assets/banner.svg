<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Enterprise Agent Harness</title>
  <desc id="d">Agent = Model + Harness. A production template that turns an LLM into a reliable, safe and capable agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .h { font: 800 52px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; letter-spacing: 1px; }
      .s { font: 500 20px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #94a3b8; }
      .p { font: 600 19px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #e2e8f0; }
      .c { font: 600 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #cbd5e1; letter-spacing: .5px; }
      .q { font: 700 22px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; }
      .flow { stroke-dasharray: 4 6; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect width="1280" height="420" rx="18" fill="url(#glowL)"/>
  <rect width="1280" height="420" rx="18" fill="url(#glowR)"/>

  <!-- Title -->
  <text x="640" y="88" text-anchor="middle" class="h">
    <tspan fill="#f8fafc">ENTERPRISE AGENT HARNESS</tspan>
  </text>
  <text x="640" y="124" text-anchor="middle" class="s">Production template that turns an LLM into a reliable, safe and capable agent</text>

  <!-- Flow: User/API -> Harness -> LLM -> Tools/Env -> Results -->
  <g transform="translate(70,160)">
    <g>
      <rect x="0" y="0" width="190" height="58" rx="29" fill="#0f1b2e" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="30" cy="29" r="7" fill="#22d3ee" class="pulse"/>
      <text x="108" y="36" text-anchor="middle" class="p">User / API</text>
    </g>
    <line x1="194" y1="29" x2="246" y2="29" stroke="#22d3ee" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
    <g transform="translate(250,0)">
      <rect x="0" y="0" width="190" height="58" rx="29" fill="#0f1b2e" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="30" cy="29" r="7" fill="#22d3ee" class="pulse"/>
      <text x="108" y="36" text-anchor="middle" class="p">Harness</text>
    </g>
    <line x1="444" y1="29" x2="496" y2="29" stroke="#a78bfa" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
    <g transform="translate(500,0)">
      <rect x="0" y="0" width="190" height="58" rx="29" fill="#16132e" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="24" cy="29" r="7" fill="#a78bfa" class="pulse"/>
      <text x="111" y="36" text-anchor="middle" class="p" font-size="18">LLM · Reasoning</text>
    </g>
    <line x1="694" y1="29" x2="746" y2="29" stroke="#fbbf24" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
    <g transform="translate(750,0)">
      <rect x="0" y="0" width="190" height="58" rx="29" fill="#1d1a12" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="30" cy="29" r="7" fill="#fbbf24" class="pulse"/>
      <text x="108" y="36" text-anchor="middle" class="p">Tools / Env</text>
    </g>
    <line x1="944" y1="29" x2="996" y2="29" stroke="#34d399" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
    <g transform="translate(1000,0)">
      <rect x="0" y="0" width="140" height="58" rx="29" fill="#0f2422" stroke="#34d399" stroke-width="2"/>
      <circle cx="28" cy="29" r="7" fill="#34d399" class="pulse"/>
      <text x="80" y="36" text-anchor="middle" class="p">Results</text>
    </g>
  </g>

  <!-- Capability chips -->
  <g transform="translate(92,258)">
    <g><rect width="150" height="34" rx="8" fill="#13203a" stroke="#22d3ee" stroke-opacity=".6"/><text x="75" y="22" text-anchor="middle" class="c">ReAct agent loop</text></g>
    <g transform="translate(160,0)"><rect width="150" height="34" rx="8" fill="#13203a" stroke="#f472b6" stroke-opacity=".6"/><text x="75" y="22" text-anchor="middle" class="c">Policy + approvals</text></g>
    <g transform="translate(320,0)"><rect width="150" height="34" rx="8" fill="#13203a" stroke="#fbbf24" stroke-opacity=".6"/><text x="75" y="22" text-anchor="middle" class="c">Docker / K8s sandbox</text></g>
    <g transform="translate(480,0)"><rect width="150" height="34" rx="8" fill="#13203a" stroke="#a78bfa" stroke-opacity=".6"/><text x="75" y="22" text-anchor="middle" class="c">Memory · pgvector</text></g>
    <g transform="translate(640,0)"><rect width="150" height="34" rx="8" fill="#13203a" stroke="#34d399" stroke-opacity=".6"/><text x="75" y="22" text-anchor="middle" class="c">Multi-agent teams</text></g>
    <g transform="translate(800,0)"><rect width="150" height="34" rx="8" fill="#13203a" stroke="#22d3ee" stroke-opacity=".6"/><text x="75" y="22" text-anchor="middle" class="c">Traces · metrics</text></g>
    <g transform="translate(960,0)"><rect width="136" height="34" rx="8" fill="#13203a" stroke="#f472b6" stroke-opacity=".6"/><text x="68" y="22" text-anchor="middle" class="c">Evals + CI gate</text></g>
  </g>

  <!-- Tagline -->
  <text x="640" y="358" text-anchor="middle" class="q">
    <tspan fill="#f8fafc">The model thinks. </tspan><tspan fill="#22d3ee">The harness makes thinking executable, safe &amp; reliable.</tspan>
  </text>
  <text x="640" y="392" text-anchor="middle" class="c" fill="#64748b">Agent = Model + Harness</text>
</svg>
