name: Feature request
description: Propose a new capability or extension point
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves it. Could it be a plugin (tool, provider, sandbox) instead of a core change?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and cost impact
      description: Does this add new actions, network access, data access or spend? How is it controlled?
