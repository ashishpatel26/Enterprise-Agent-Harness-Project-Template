name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      HARNESS_TEST_DATABASE_URL: postgresql://harness:harness@localhost:5432/harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build sandbox image (enables Docker escape tests)
        run: docker build -f docker/sandbox.Dockerfile -t agent-harness-sandbox:latest .
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage gate (core, tools, safety, sandbox >= 80%)
        run: uv run coverage report --include="src/harness/core/*,src/harness/tools/*,src/harness/safety/*,src/harness/sandbox/*" --fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox.Dockerfile
          push: false
          tags: agent-harness-sandbox:ci

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/agent-harness --set secrets.existingSecret=ci
      - run: >
          helm template ci deploy/helm/agent-harness
          --set secrets.existingSecret=ci --set ingress.enabled=true
          --set sandbox.runtimeClassName=gvisor > rendered.yaml
      - name: Validate manifests against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml
