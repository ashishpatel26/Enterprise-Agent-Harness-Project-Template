{{- if and (not .Values.secrets.existingSecret) .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.create }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
