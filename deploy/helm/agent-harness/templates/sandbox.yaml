{{- $ns := .Values.sandbox.namespace -}}
{{- if .Values.sandbox.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "agent-harness.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
{{- end }}
# Sandbox Pods get no network at all: no ingress, no egress (not even DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-all
  namespace: {{ $ns }}
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      agent-harness.sandbox: "1"
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: {{ $ns }}
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.sandbox.quota.pods | quote }}
    limits.cpu: {{ .Values.sandbox.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.sandbox.quota.limitsMemory | quote }}
    configmaps: {{ mul (int .Values.sandbox.quota.pods) 2 | quote }}
---
# Least privilege: the API may manage only Pods/ConfigMaps, only in the sandbox namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-harness.fullname" . }}-sandbox
  namespace: {{ $ns }}
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods/status, pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-harness.fullname" . }}-sandbox
  namespace: {{ $ns }}
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-harness.fullname" . }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-harness.fullname" . }}
    namespace: {{ .Release.Namespace }}
