{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-harness.fullname" . }}
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "agent-harness.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8000, protocol: TCP}
      {{- with .Values.networkPolicy.ingressFromNamespaces }}
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
{{- end }}
