apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-harness.fullname" . }}-config
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  HARNESS_SANDBOX_BACKEND: kubernetes
  HARNESS_SANDBOX_IMAGE: {{ .Values.sandbox.image | quote }}
  HARNESS_SANDBOX_NAMESPACE: {{ .Values.sandbox.namespace | quote }}
  {{- with .Values.sandbox.runtimeClassName }}
  HARNESS_SANDBOX_RUNTIME: {{ . | quote }}
  {{- end }}
{{- if .Values.agents }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-harness.fullname" . }}-agents
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
data:
  {{- range $name, $body := .Values.agents }}
  {{ $name }}: |
    {{- $body | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.policy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-harness.fullname" . }}-policy
  labels: {{- include "agent-harness.labels" . | nindent 4 }}
data:
  default.yaml: |
    {{- .Values.policy | nindent 4 }}
{{- end }}
